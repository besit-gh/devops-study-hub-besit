name: Translate curriculum to Russian

on:
  push:
    branches:
      - localization/ru-ru
    paths:
      - backend/translate_content.py

permissions:
  contents: write

jobs:
  translate:
    if: contains(github.event.head_commit.message, '[translate]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout localization branch
        uses: actions/checkout@v4
        with:
          ref: localization/ru-ru

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install translation dependencies
        run: python -m pip install --upgrade openai python-dotenv

      - name: Translate Markdown curriculum and reference guides
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Add OPENAI_API_KEY to the repository Actions secrets to run the bulk translation."
            exit 1
          fi
          python backend/translate_content.py --markdown-only --apply

      - name: Commit translated materials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content reference
          if git diff --cached --quiet; then
            echo "No new translation changes to commit."
          else
            git commit -m "Перевести учебные материалы через OpenAI"
            git push origin localization/ru-ru
          fi
